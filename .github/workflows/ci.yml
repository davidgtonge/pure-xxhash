name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Every job is read-only unless it says otherwise; only `publish` gets more (an OIDC token for npm).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Supply-chain notes:
# - Actions are pinned to full commit SHAs (the comment gives the release), so a moved or hijacked tag
#   can't change what runs here. Dependabot (.github/dependabot.yml) proposes updates.
# - Tag builds, which get published, never restore a cache, so a cache written by another run can't
#   leak into a release.

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Type check with the strict extras, then oxlint.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
      - run: npm ci
      - run: npm run lint

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '${{ matrix.node }}'
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
      - run: npm ci
      - run: npm test

  # xxHash's own sanity vectors (45,771 results), downloaded from one pinned commit of the xxHash
  # repository. They aren't committed (see test/vectors/README.md), so `npm test` skips them when
  # absent; here nothing may be skipped.
  official:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
      - run: npm ci
      - run: npm run vectors:official
      - name: Official vectors, with nothing skipped
        shell: bash # with pipefail, so a failing test run fails the step despite the tee
        run: |
          npm run build
          node --test --test-reporter=tap test/official.test.mjs 2>&1 | tee test.log
          grep -q '^# skipped 0$' test.log || { echo "::error::the official vectors were skipped"; exit 1; }

  # Packs exactly what a release publishes, installs the tarball into a fresh project, and compiles a
  # consumer against it: strict, without skipLibCheck, as users meet the types.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, package-manager-cache: false }
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball in a fresh project and compile against it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y >/dev/null && npm pkg set type=module
          npm install --no-audit --no-fund ../pure-xxhash-*.tgz typescript@5
          cat > main.ts <<'EOF'
          import { xxh32, xxh32Create, xxh32Update, xxh32Digest, xxh64, xxh64Pair, xxh3, xxh128, xxh3Secret, type Uint64Pair } from 'pure-xxhash';
          const bytes = new TextEncoder().encode('pure-xxhash');
          const checksum: number = xxh32(bytes, 0);
          const streamed: number = xxh32Digest(xxh32Update(xxh32Create(0), bytes));
          if (checksum !== streamed) throw new Error('streaming and one-shot XXH32 differ');
          const pair: Uint64Pair = xxh64Pair(bytes);
          const wide: bigint = xxh64(bytes, 7n);
          const secret = xxh3Secret(new Uint8Array(192).fill(1));
          console.log(checksum, pair, wide, xxh3(bytes), xxh3(bytes, secret), xxh128(bytes));
          EOF
          echo '{ "compilerOptions": { "module": "NodeNext", "moduleResolution": "NodeNext", "target": "ES2022", "strict": true, "outDir": "out" } }' > tsconfig.json
          npx tsc -p .
          node out/main.js

  # The other runtimes the README names. Each builds dist/ with Node, then runs it elsewhere.
  # test/portable/suite.mjs is one check with no Node APIs (all four algorithms, seeded and
  # streamed, against xxHash's C output); `npm test` runs it in Node too.
  deno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
      - run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      # Deno runs the whole Node suite (node:test, node:assert) as well as the portable one.
      - run: deno test --allow-read --allow-env --no-check test/
      - run: deno run --allow-read test/portable/run.mjs

  bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
      - run: npm ci
      - run: npm run build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun test/portable/run.mjs

  # Chromium, Firefox and WebKit, each on the page and in a module web worker.
  browsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
      - run: npm ci
      - run: npm run build
      # Test-only tool, never part of the package; pinned here so updates are deliberate.
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node test/portable/browsers.mjs

  # workerd, Cloudflare's Workers runtime, through Miniflare.
  workerd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false miniflare@4.20260730.0
      - run: node test/portable/miniflare.mjs

  # Runs only for a pushed tag like v0.1.0, after everything above passes, and only once someone
  # approves the `npm` environment (Settings > Environments). Authenticates with npm trusted
  # publishing: GitHub issues a short-lived OIDC token that npm accepts for packages that name this
  # workflow and environment as their trusted publisher, so no npm token exists. npm also attaches
  # provenance, linking the published version to this run and commit.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, official, package, deno, bun, browsers, workerd]
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/pure-xxhash
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusted publishing (and provenance) needs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # No cache, and no registry-url: that option writes an .npmrc whose token placeholder can stop npm
      # from trying OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, package-manager-cache: false }
      - name: Check npm is new enough for trusted publishing (11.5.1+)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing"; exit 1; }
      # --ignore-scripts: no dependency gets to run code in the job that can publish.
      - run: npm ci --ignore-scripts
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json is $version"; exit 1; }
      # prepublishOnly runs the lint and the tests (which build dist) once more, on exactly this checkout.
      - run: npm publish --access public
